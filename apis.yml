name: DataGravity
description: 'DataGravity was a data management and security software company founded
  in April 2012 in Nashua, New Hampshire by Paula Long (co-founder of EqualLogic) and
  John Joseph. It pioneered the "data-aware storage" category, shipping hybrid storage
  arrays that indexed, classified, and audited data in place so that security, governance,
  and search became properties of the storage tier rather than bolt-on tooling. The
  company raised venture funding from Andreessen Horowitz, General Catalyst, CRV and
  others, won Best of Show at VMworld 2014, and began shipping in October 2014. In
  February 2016 it pivoted from appliances to a software-only behavioral data-security
  product. DataGravity ceased operations in June 2017 and its assets were assigned
  to a liquidator; HyTrust acquired the technology and roughly twenty employees, folding
  the product into HyTrust CloudAdvisor (HyTrust was itself acquired by Entrust in
  2021). The datagravity.com domain no longer belongs to the company and now 301-redirects
  to an unrelated business (anomalo.com). No public API, developer portal, documentation,
  or machine-readable specification survives, so there is no API surface for this profile
  to describe.'
